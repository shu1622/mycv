<section><h2>Idiomas</h2><ng-container *ngIf="datos$ | async as datos; else cargando"><p *ngIf="errorCarga" role="alert" class="error">{{ errorCarga }}</p><ul class="tiles"><li *ngFor="let dato of datos" class="tile"><h3>{{ dato.name }}</h3><p>{{ dato.level }}</p></li></ul><p *ngIf="!errorCarga && !datos.length" class="empty">Sin registros. Agrega tu información desde admin-cv.</p></ng-container><ng-template #cargando><p>Cargando...</p></ng-template></section>
