<section><h2>Certificados</h2><ng-container *ngIf="datos$ | async as datos; else cargando"><p *ngIf="errorCarga" role="alert" class="error">{{ errorCarga }}</p><ul class="records"><li *ngFor="let dato of datos" class="record"><h3>{{ dato.name }}</h3><p>{{ dato.institution }}</p><p class="dates">{{ dato.date }}</p><a *ngIf="dato.url && (dato.url.startsWith('https://') || dato.url.startsWith('http://'))" [href]="dato.url" target="_blank" rel="noopener noreferrer">Ver certificado</a></li></ul><p *ngIf="!errorCarga && !datos.length" class="empty">Sin registros. Agrega tu información desde admin-cv.</p></ng-container><ng-template #cargando><p>Cargando...</p></ng-template></section>
