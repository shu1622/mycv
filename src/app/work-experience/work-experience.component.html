<section><h2>Experiencia laboral</h2><ng-container *ngIf="datos$ | async as datos; else cargando"><p *ngIf="errorCarga" role="alert" class="error">{{ errorCarga }}</p><ul class="records"><li *ngFor="let dato of datos" class="record"><h3>{{ dato.position }}</h3><p>{{ dato.company }}</p><p class="location">{{ dato.location }}</p><p class="dates">{{ dato.startDate }} — {{ dato.endDate }}</p><p class="description">{{ dato.accomplishments }}</p></li></ul><p *ngIf="!errorCarga && !datos.length" class="empty">Sin registros. Agrega tu información desde admin-cv.</p></ng-container><ng-template #cargando><p>Cargando...</p></ng-template></section>
