<ng-container *ngIf="datos$ | async as datos; else cargando"><header class="cv-header" *ngFor="let header of datos | slice:0:1"><div><h1>{{ header.Nombre || header.name }}</h1><p>{{ header.goalLife }}</p></div><img *ngIf="header.photoUrl; else sinFoto" class="photo" [src]="header.photoUrl" alt="Foto de perfil"><ng-template #sinFoto><div class="photo-placeholder" aria-label="Foto pendiente">LD</div></ng-template><div class="contact"><div>{{ header.email }}</div><div>{{ header.phoneNumber }}</div><div>{{ header.location }}</div><div>{{ header.socialNetwork }}</div></div></header><p *ngIf="errorCarga" role="alert" class="error">{{ errorCarga }}</p><p *ngIf="!errorCarga && !datos.length" class="empty">No hay datos de encabezado.</p></ng-container><ng-template #cargando><p>Cargando...</p></ng-template>
